    <rect class="shine" x="0" y="-40" width="160" height="350" fill="url(#sh)" transform="skewX(-18)"/></g>
    <rect x="1" y="1" width="598" height="268" rx="19" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
