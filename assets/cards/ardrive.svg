<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="ARDrive — Your Google Drive in augmented reality. Browse and arrange files as objects floating in the room around you."><title>ARDrive — Your Google Drive in augmented reality. Browse and arrange files as objects floating in the room around you.</title><style>
    .shine{animation:shine 8s ease-in-out infinite 3.5s}
    @keyframes shine{0%{transform:translateX(-260px)}22%,100%{transform:translateX(900px)}}
    .glow{animation:glow 5s ease-in-out infinite 2.0s;transform-box:fill-box;transform-origin:center}
    @keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
    .in{animation:in .9s cubic-bezier(.2,.8,.2,1) both 0.25s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    </style><defs>
    <clipPath id="cl"><rect width="600" height="270" rx="20"/></clipPath>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
