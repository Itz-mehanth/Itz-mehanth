<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Things I&#x27;ve built"><title>Things I&#x27;ve built</title><style>
    .draw{stroke-dasharray:1200;animation:draw 1.6s cubic-bezier(.6,0,.2,1) both .2s}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .in{animation:in .8s ease-out both}
    @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
    </style><defs><linearGradient id="l" x1="0" x2="1">
              <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity=".25"/>
              <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient></defs>
            <g class="in"><text x="2" y="66" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#8B5CF6">/02</text>
            <text x="58" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="38" font-weight="750" letter-spacing="-.5" fill="#0D1117">Things I&#8217;ve built</text>
            <text x="1198" y="66" text-anchor="end" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#57606A">8 picks from 60+ repos</text></g>
            <path class="draw" d="M0 92H1200" stroke="url(#l)" stroke-width="2"/>
            <circle r="3.5" fill="#8B5CF6"><animateMotion dur="5s" repeatCount="indefinite" path="M0 92H1200"
              keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".6 0 .4 1"/>
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.75;1" dur="5s" repeatCount="indefinite"/></circle></svg>