<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Let&#x27;s build something"><title>Let&#x27;s build something</title><style>
    .draw{stroke-dasharray:1200;animation:draw 1.6s cubic-bezier(.6,0,.2,1) both .2s}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .in{animation:in .8s ease-out both}
    @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
    </style><defs><linearGradient id="l" x1="0" x2="1">
              <stop offset="0" stop-color="#FFB547"/><stop offset=".55" stop-color="#FFB547" stop-opacity=".25"/>
              <stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient></defs>
            <g class="in"><text x="2" y="66" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#FFB547">/05</text>
            <text x="58" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="38" font-weight="750" letter-spacing="-.5" fill="#E6EDF3">Let&#8217;s build something</text>
            <text x="1198" y="66" text-anchor="end" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8B95A7">inbox is open</text></g>
            <path class="draw" d="M0 92H1200" stroke="url(#l)" stroke-width="2"/>
            <circle r="3.5" fill="#FFB547"><animateMotion dur="5s" repeatCount="indefinite" path="M0 92H1200"
              keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".6 0 .4 1"/>
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.75;1" dur="5s" repeatCount="indefinite"/></circle></svg>